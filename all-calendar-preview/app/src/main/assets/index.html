<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALL Calendar</title>
<style>
  :root { color-scheme: dark; --bg:#1a1b18; --tile:#262722; --fg:#dddbd0; --sub:#a5a498; --or:#ff6a1f; --ye:#f2d21f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#171814; color:var(--fg); font:400 16px/1.5 Roboto,system-ui,sans-serif; touch-action:pan-y; }
  main { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding:18px clamp(12px, 4vw, 32px) max(12px, env(safe-area-inset-bottom)); }
  header, nav { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header { padding-bottom:12px; }
  h1, h2, p { margin:0; }
  h1 { font-size:1rem; font-weight:700; letter-spacing:.025em; }
  h1 span { color:var(--or); }
  h2 { font-size:1.12rem; text-align:center; }
  small, time, .muted { color:var(--sub); }
  nav { margin:12px 0; }
  .modes { display:flex; flex-wrap:wrap; gap:8px; }
  .modes button { font:600 .72rem/1 Roboto,system-ui,sans-serif; letter-spacing:.14em; color:var(--sub); background:transparent; border-radius:0; border-bottom:2px solid transparent; }
  .modes button[aria-pressed="true"] { color:var(--fg); border-bottom-color:var(--or); }
  #view { flex:1; display:flex; flex-direction:column; }
  .date-nav { margin:0 0 12px; }
  .date-nav h2 { font:300 clamp(2rem, 9vw, 4rem)/1.12 Roboto,'Segoe UI',sans-serif; letter-spacing:-.055em; font-variant-numeric:tabular-nums; }
  .date-nav button { min-width:44px; background:transparent; font-size:1.6rem; }
  button { color:inherit; font:inherit; cursor:pointer; border:0; border-radius:6px; background:var(--tile); min-height:44px; padding:6px 12px; }
  button:focus-visible { outline:2px solid var(--or); outline-offset:2px; }
  .grid { flex:1; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:30px; grid-auto-rows:minmax(51px,1fr); text-align:center; }
  .grid > small { font-size:.7rem; align-self:center; }
  .grid > button, .grid > span { border-top:1px solid #383930; }
  .grid button { display:grid; justify-items:center; align-content:center; gap:8px; min-width:0; padding:4px 0; background:transparent; border-radius:0; }
  .grid button[aria-current] .date-number { color:var(--or); }
  .grid button[data-selected] { background:#26251e; }
  .date-number { font:300 clamp(1.15rem, 6.5vw, 2.35rem)/1 Roboto,'Segoe UI',sans-serif; font-variant-numeric:tabular-nums; }
  .dots { display:flex; align-items:center; justify-content:center; gap:3px; min-height:5px; }
  .dots i { width:4px; height:4px; border-radius:50%; background:var(--or); }
  .timeline { display:grid; gap:10px; }
  .timeline button { display:grid; grid-template-columns:minmax(4rem, 19%) 1fr; align-items:center; gap:16px; padding:16px 4px; text-align:left; background:transparent; border-radius:0; border-bottom:1px solid #383930; }
  .timeline time { font-variant-numeric:tabular-nums; }
  .timeline small { display:block; }
  .log-entry { user-select:none; -webkit-touch-callout:none; }
  .log-entry:focus-within { outline:2px solid var(--or); outline-offset:2px; }
  .empty { padding:16px 0; color:var(--sub); }
</style>
<main>
  <header><h1><span>ALL</span> Calendar</h1><small>サンプルデータ</small></header>
  <nav aria-label="表示の切り替え">
    <div class="modes"><button id="month" type="button">MONTHLY</button><button id="day" type="button">DAILY</button></div>
  </nav>
  <section id="view" aria-label="ライフログの表示" aria-live="polite"></section>
</main>
<script>
  const view = document.querySelector('#view');
  const monthButton = document.querySelector('#month');
  const dayButton = document.querySelector('#day');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const today = new Date();
  const dateAt = (date, offset = 0) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + offset);
  const monthAt = (date, offset = 0) => new Date(date.getFullYear(), date.getMonth() + offset, 1);
  const key = date => [date.getFullYear(), date.getMonth() + 1, date.getDate()].join('-');
  const same = (a, b) => key(a) === key(b);
  const monthLabel = date => `${date.getFullYear()}.${date.getMonth() + 1}`;
  const dayLabel = date => `${monthLabel(date)}.${date.getDate()}`;
  const logs = [
    [-4,'07:10','起床','起床'], [-4,'09:15','タスク','開発メモを整理'],
    [-2,'07:02','起床','起床'], [-2,'11:20','発信','佐藤さん'],
    [-1,'08:45','予定','朝の打ち合わせ'], [-1,'15:30','着信','佐藤さん'],
    [0,'06:55','起床','起床'], [0,'09:00','予定','朝の打ち合わせ'],
    [0,'10:20','タスク','開発メモを整理'], [0,'14:35','発信','佐藤さん'],
    [1,'09:30','予定','開発レビュー'], [1,'13:00','予定','歯科'],
    [3,'09:00','予定','朝の打ち合わせ（週次）'], [7,'18:00','予定','買い物']
  ].map(([offset, time, kind, title]) => ({date:dateAt(today, offset), time, kind, title}));
  let day = dateAt(today);
  let month = monthAt(day);
  let mode = 'month';
  let query = '';
  let gesture;

  function element(tag, label, parent, className) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    node.textContent = label;
    parent.append(node);
    return node;
  }
  function button(parent, label, action, accessibleLabel = label) {
    const node = element('button', label, parent);
    node.type = 'button';
    node.setAttribute('aria-label', accessibleLabel);
    node.addEventListener('click', action);
    return node;
  }
  function heading(label, unit, move) {
    const nav = element('nav', '', view, 'date-nav');
    button(nav, '‹', () => move(-1), `前${unit}`);
    element('h2', label, nav);
    button(nav, '›', () => move(1), `次の${unit}`);
  }
  function openDay(date, direction = 0) {
    day = date;
    month = monthAt(day);
    mode = 'day';
    render(direction);
  }
  function moveDay(offset) { openDay(dateAt(day, offset), offset); }
  function renderMonth() {
    heading(monthLabel(month), '月', offset => { month = monthAt(month, offset); render(offset); });
    const grid = element('div', '', view, 'grid');
    for (const label of '月火水木金土日') element('small', label, grid);
    const leadingDays = (month.getDay() + 6) % 7;
    for (let i = 0; i < leadingDays; i++) element('span', '', grid);
    for (let date = month; date.getMonth() === month.getMonth(); date = dateAt(date, 1)) {
      const count = logs.filter(log => same(log.date, date)).length;
      const cell = button(grid, '', () => openDay(date), `${dayLabel(date)}、記録${count}件`);
      element('span', String(date.getDate()), cell, 'date-number');
      const dots = element('span', '', cell, 'dots');
      dots.setAttribute('aria-hidden', 'true');
      for (let i = 0; i < Math.min(count, 5); i++) element('i', '', dots);
      if (same(day, date)) cell.setAttribute('data-selected', '');
      if (same(today, date)) cell.setAttribute('aria-current', 'date');
    }
  }
  function renderLogs(entries, search) {
    if (!entries.length) return element('p', search ? '一致する記録がありません' : '記録はありません', view, 'empty');
    const list = element('div', '', view, 'timeline');
    for (const log of entries) {
      const label = `${search ? dayLabel(log.date) + ' ' : ''}${log.time} ${log.kind} ${log.title}`;
      const openSearch = () => {
        query = log.title;
        mode = 'search';
        render();
      };
      const row = button(list, '', event => {
        if (search) openDay(log.date);
        else if (event.detail === 0) openSearch();
      }, search ? label : `${label}、長押しでタイトル検索`);
      if (!search) {
        row.classList.add('log-entry');
        row.addEventListener('contextmenu', event => event.preventDefault());
        row.addEventListener('pointerdown', event => {
          if (event.pointerType === 'touch' || event.button !== 0) return;
          startHold(row, event.clientX, event.clientY, openSearch);
        });
        row.addEventListener('touchstart', event => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          startHold(row, touch.clientX, touch.clientY, openSearch);
        }, { passive:true });
      }
      const timing = element('span', '', row);
      if (search) element('small', dayLabel(log.date), timing);
      element('time', log.time, timing);
      const info = element('span', log.title, row);
      element('small', log.kind, info);
    }
  }
  function renderContent() {
    view.replaceChildren();
    if (mode === 'month') return renderMonth();
    if (mode === 'day') {
      heading(dayLabel(day), '日', moveDay);
      return renderLogs(logs.filter(log => same(log.date, day)), false);
    }
    const nav = element('nav', '', view);
    button(nav, '‹ 1日表示', () => openDay(day));
    element('h2', `「${query}」の記録`, nav);
    const needle = query.normalize('NFKC').toLocaleLowerCase('ja');
    renderLogs(logs.filter(log => log.title.normalize('NFKC').toLocaleLowerCase('ja').includes(needle)), true);
  }
  let renderedMode;
  let viewAnimation;
  function render(direction = 0) {
    const firstRender = !renderedMode;
    const changedMode = renderedMode !== mode;
    renderedMode = mode;
    viewAnimation?.cancel();
    monthButton.setAttribute('aria-pressed', String(mode === 'month'));
    dayButton.setAttribute('aria-pressed', String(mode !== 'month'));
    renderContent();
    if (firstRender || motion.matches || !view.animate || (!changedMode && !direction)) return;
    const from = direction ? `translateX(${direction * 24}px)` : 'translateY(8px)';
    const options = { duration:340, easing:'cubic-bezier(.19,1,.22,1)' };
    viewAnimation = view.animate([{ opacity:.55, transform:from }, { opacity:1, transform:'none' }], options);
    if (changedMode && mode === 'day') {
      view.querySelectorAll('.timeline button').forEach((row, index) => {
        row.animate([{ opacity:0, transform:'translateY(14px)' }, { opacity:1, transform:'none' }], {
          ...options, delay:Math.min(index, 8) * 34 + 60, fill:'backwards'
        });
      });
    }
  }
  let hold;
  function cancelHold() {
    if (hold) clearTimeout(hold.timer);
    hold = undefined;
  }
  function startHold(row, x, y, action) {
    cancelHold();
    hold = { x, y, timer:setTimeout(() => {
      hold = undefined;
      gesture = undefined;
      if (row.isConnected && mode === 'day') action();
    }, 500) };
  }
  function checkHoldMovement(x, y) {
    if (hold && Math.hypot(x - hold.x, y - hold.y) > 10) cancelHold();
  }
  document.addEventListener('pointermove', event => checkHoldMovement(event.clientX, event.clientY));
  document.addEventListener('pointerup', event => { if (event.pointerType !== 'touch') cancelHold(); });
  document.addEventListener('pointercancel', event => { if (event.pointerType !== 'touch') cancelHold(); });
  monthButton.addEventListener('click', () => { mode = 'month'; render(); });
  dayButton.addEventListener('click', () => openDay(day));
  document.addEventListener('touchstart', event => {
    if (event.touches.length !== 1) cancelHold();
    gesture = mode === 'day' && event.touches.length === 1 ? event.touches[0] : undefined;
  }, { passive:true });
  document.addEventListener('touchmove', event => {
    const touch = event.touches[0];
    if (touch) checkHoldMovement(touch.clientX, touch.clientY);
  }, { passive:true });
  document.addEventListener('touchcancel', () => { gesture = undefined; cancelHold(); });
  document.addEventListener('touchend', event => {
    cancelHold();
    const start = gesture;
    gesture = undefined;
    if (!start || mode !== 'day') return;
    const end = Array.from(event.changedTouches).find(touch => touch.identifier === start.identifier);
    if (!end) return;
    const dx = end.clientX - start.clientX;
    const dy = end.clientY - start.clientY;
    if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    if (event.cancelable) event.preventDefault();
    moveDay(dx < 0 ? 1 : -1);
  }, { passive:false });
  render();
</script>
</html>
