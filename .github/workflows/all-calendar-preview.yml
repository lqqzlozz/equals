name: ALL Calendar preview APK
on:
  push:
    branches: [feature/all-calendar-apk]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: all-calendar-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - run: |
          sdk="$ANDROID_HOME/build-tools/34.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/aapt" dump badging "$apk" | grep -F 'com.akiramoriki.allcalendar.preview'
          cp "$apk" ALL-Calendar-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ALL-Calendar-preview
          path: all-calendar-preview/ALL-Calendar-preview.apk
          if-no-files-found: error
          retention-days: 30
